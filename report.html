<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>运费统计报表 - Admin</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Theme style (AdminLTE 3) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
    <style>
        /* 自定义样式补充 */
        .login-page-custom {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
        }
        #mainContent {
            display: none; /* 默认隐藏，登录后显示 */
        }
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.7);
            z-index: 101;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 移动端优化 */
        @media (max-width: 576px) {
            .hidden-mobile {
                display: none !important;
            }
            .table td, .table th {
                padding: 0.75rem 0.3rem; /* 减小内边距 */
                font-size: 0.9rem;
            }
            
            /* 隐藏非核心区域 */
            .content-header, .main-footer {
                display: none !important;
            }
            
            /* 紧凑化布局 */
            .content {
                padding-top: 10px;
            }
            
            /* 统计卡片极简模式 */
            .small-box {
                margin-bottom: 10px;
                box-shadow: none;
                border: 1px solid rgba(0,0,0,0.1);
                text-align: center;
            }
            .small-box .inner {
                padding: 5px;
            }
            .small-box h3 {
                font-size: 1.2rem;
                margin: 0;
            }
            .small-box p {
                font-size: 0.8rem;
                margin: 0;
            }
            .small-box .icon {
                display: none;
            }
            
            /* 筛选栏紧凑化 */
            .card-header {
                padding: 0.5rem 0.8rem;
            }
            .card-body {
                padding: 0.5rem !important;
            }
            .form-group {
                margin-bottom: 5px;
            }
            .form-control {
                height: calc(2rem + 2px);
                padding: 0.25rem 0.5rem;
                font-size: 0.9rem;
            }
            label {
                margin-bottom: 0.2rem;
                font-size: 0.9rem;
            }
        }
        
        /* 表格行点击效果 */
        tr.clickable-row {
            cursor: pointer;
        }
        tr.clickable-row:hover {
            background-color: #f8f9fa;
        }
        
        /* 快捷日期按钮容器 */
        .quick-date-container {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }
        .quick-date-btn {
            font-size: 0.85rem;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
        }
        @media (max-width: 576px) {
            .quick-date-container {
                margin-bottom: 8px;
                gap: 4px;
            }
            .quick-date-btn {
                font-size: 0.8rem;
                padding: 0.2rem 0.45rem;
            }
        }
    </style>
</head>
<body class="hold-transition layout-top-nav">

    <!-- 登录界面 -->
    <div id="passwordContainer" class="login-page login-page-custom">
        <div class="login-box">
            <div class="card card-outline card-primary">
                <div class="card-header text-center">
                    <a href="#" class="h1"><b>运费</b>统计系统</a>
                </div>
                <div class="card-body">
                    <p class="login-box-msg">请输入管理密码以继续</p>
                    <div class="input-group mb-3">
                        <input type="password" id="passwordInput" class="form-control" placeholder="密码">
                        <div class="input-group-append">
                            <div class="input-group-text">
                                <span class="fas fa-lock"></span>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12">
                            <button id="loginButton" class="btn btn-primary btn-block">登录</button>
                        </div>
                    </div>
                    <div class="mt-3 text-center">
                        <a href="index.html" class="text-sm">返回扫码录入页</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="mainContent" class="wrapper">
        <!-- Navbar -->
        <nav class="main-header navbar navbar-expand-md navbar-light navbar-white">
            <div class="container">
                <a href="#" class="navbar-brand">
                    <span class="brand-text font-weight-light">运费统计系统</span>
                </a>
                
                <ul class="navbar-nav ml-auto">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link">
                            <i class="fas fa-barcode mr-1"></i> 返回录入
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" data-toggle="modal" data-target="#changePasswordModal">
                            <i class="fas fa-key mr-1"></i> 修改密码
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" class="nav-link" onclick="logout()">
                            <i class="fas fa-sign-out-alt mr-1"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Content Wrapper -->
        <div class="content-wrapper">
            <!-- Content Header -->
            <div class="content-header">
                <div class="container">
                    <div class="row mb-2">
                        <div class="col-sm-6">
                            <h1 class="m-0"> 数据报表 <small>实时统计</small></h1>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <div class="content">
                <div class="container">
                    
                    <!-- 筛选栏 -->
                    <div class="card card-primary card-outline">
                        <div class="card-header">
                            <h3 class="card-title"><i class="fas fa-filter mr-1"></i> 筛选条件</h3>
                            <div class="card-tools">
                                <button type="button" class="btn btn-tool" data-card-widget="collapse">
                                    <i class="fas fa-minus"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-body">
                            <!-- 快捷日期筛选 -->
                            <div class="quick-date-container">
                                <span class="text-muted mr-1" style="font-size: 0.875rem;"><i class="far fa-calendar-alt mr-1"></i>快捷筛选：</span>
                                <button type="button" class="btn btn-outline-primary quick-date-btn" onclick="setDateRange('today', this)">今天</button>
                                <button type="button" class="btn btn-outline-primary quick-date-btn" onclick="setDateRange('yesterday', this)">昨天</button>
                                <button type="button" class="btn btn-outline-primary quick-date-btn" onclick="setDateRange('beforeYesterday', this)">前天</button>
                                <button type="button" class="btn btn-outline-secondary quick-date-btn" onclick="setDateRange('last3', this)">近3天</button>
                                <button type="button" class="btn btn-outline-secondary quick-date-btn" onclick="setDateRange('last7', this)">近7天</button>
                                <button type="button" class="btn btn-outline-secondary quick-date-btn" onclick="setDateRange('all', this)">全部</button>
                            </div>
                            <div class="row">
                                <div class="col-md-3 col-6">
                                    <div class="form-group">
                                        <label>开始日期</label>
                                        <input type="date" id="startDate" class="form-control">
                                    </div>
                                </div>
                                <div class="col-md-3 col-6">
                                    <div class="form-group">
                                        <label>结束日期</label>
                                        <input type="date" id="endDate" class="form-control">
                                    </div>
                                </div>
                                <div class="col-md-6 col-12">
                                    <div class="form-group">
                                        <label>运单号搜索</label>
                                        <div class="input-group">
                                            <input type="text" id="trackNo" class="form-control" placeholder="输入运单号...">
                                            <div class="input-group-append">
                                                <span class="input-group-text"><i class="fas fa-search"></i></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 统计卡片 -->
                    <div class="row">
                        <div class="col-lg-6 col-6">
                            <!-- small box -->
                            <div class="small-box bg-info">
                                <div class="inner">
                                    <h3 id="totalCount">0</h3>
                                    <p>总单量</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-box-open"></i>
                                </div>
                            </div>
                        </div>
                        <!-- ./col -->
                        <div class="col-lg-6 col-6">
                            <!-- small box -->
                            <div class="small-box bg-success">
                                <div class="inner">
                                    <h3><sup style="font-size: 20px">¥</sup><span id="totalFee">0.00</span></h3>
                                    <p>总运费</p>
                                </div>
                                <div class="icon">
                                    <i class="fas fa-yen-sign"></i>
                                </div>
                            </div>
                        </div>
                        <!-- ./col -->
                    </div>

                    <!-- 数据表格 -->
                    <div class="card">
                        <div class="card-header border-0">
                            <h3 class="card-title">最近记录 <small class="text-muted d-block d-sm-none" style="font-size: 0.7em;">点击行查看详情</small></h3>
                            <div class="card-tools">
                                <a href="#" class="btn btn-tool btn-sm" onclick="fetchData()">
                                    <i class="fas fa-sync-alt"></i>
                                </a>
                            </div>
                        </div>
                        <div class="card-body table-responsive p-0">
                            <div id="loading" class="loading-overlay" style="display: none;">
                                <div class="spinner-border text-primary" role="status">
                                    <span class="sr-only">Loading...</span>
                                </div>
                            </div>
                            <table class="table table-striped table-valign-middle">
                                <thead>
                                <tr>
                                    <th class="hidden-mobile">时间</th>
                                    <th>运单号</th>
                                    <th>物流商</th>
                                    <th>运费</th>
                                </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- 数据插入区 -->
                                </tbody>
                            </table>
                            <div id="noData" class="text-center p-4 text-muted" style="display: none;">
                                <i class="fas fa-inbox fa-2x mb-2"></i><br>暂无数据
                            </div>
                        </div>
                    </div>
                    <!-- /.card -->
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="main-footer">
            <div class="float-right d-none d-sm-inline">
                Version 1.0
            </div>
            <strong>Copyright &copy; 2024 <a href="#">运费统计系统</a>.</strong> All rights reserved.
        </footer>
    </div>

    <!-- 详情模态框 -->
    <div class="modal fade" id="detailModal" tabindex="-1" role="dialog" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header bg-primary">
                    <h5 class="modal-title" id="detailModalLabel">运单详情</h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <div class="list-group list-group-flush">
                        <div class="list-group-item">
                            <small class="text-muted d-block">运单号</small>
                            <h5 class="mb-0" id="modalTrackNo" style="word-break: break-all;">-</h5>
                        </div>
                        <div class="list-group-item">
                            <small class="text-muted d-block">运费</small>
                            <h4 class="text-success mb-0">¥<span id="modalFee">0.00</span></h4>
                        </div>
                        <div class="list-group-item">
                            <small class="text-muted d-block">物流商</small>
                            <span id="modalCarrier">-</span>
                        </div>
                        <div class="list-group-item">
                            <small class="text-muted d-block">录入时间</small>
                            <span id="modalTime">-</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-block" data-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" role="dialog" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="changePasswordModalLabel">修改密码</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="changePasswordForm">
                        <div class="form-group">
                            <label for="currentPassword">当前密码</label>
                            <input type="password" class="form-control" id="currentPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">新密码</label>
                            <input type="password" class="form-control" id="newPassword" required>
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">确认新密码</label>
                            <input type="password" class="form-control" id="confirmPassword" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitChangePassword()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- Bootstrap 4 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- AdminLTE App -->
    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

    <script>
        // 检测系统是否已安装
        fetch('check_install.php', {
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'not_installed') {
                window.location.href = data.redirect;
            }
        })
        .catch(err => {
            console.warn("安装检测失败", err);
        });

        const passwordContainer = document.getElementById('passwordContainer');
        const passwordInput = document.getElementById('passwordInput');
        const loginButton = document.getElementById('loginButton');
        const mainContent = document.getElementById('mainContent');
        const tableBody = document.getElementById('tableBody');
        const noData = document.getElementById('noData');
        const loading = document.getElementById('loading');
        
        let authToken = '';

        // 格式化日期为 YYYY-MM-DD
        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 初始化日期选择器
        function initDates() {
            const now = new Date();
            // 默认结束日期为今天
            document.getElementById('endDate').value = formatDate(now);
            // 开始日期留空
            document.getElementById('startDate').value = '';
        }

        // 清除快捷按钮高亮
        function clearActiveQuickButtons() {
            document.querySelectorAll('.quick-date-btn').forEach(btn => btn.classList.remove('active'));
        }

        // 快捷设置日期范围
        function setDateRange(type, btnElement) {
            const startDateInput = document.getElementById('startDate');
            const endDateInput = document.getElementById('endDate');
            clearActiveQuickButtons();

            const today = new Date();

            if (type === 'today') {
                const d = formatDate(today);
                startDateInput.value = d;
                endDateInput.value = d;
            } else if (type === 'yesterday') {
                const d = new Date();
                d.setDate(d.getDate() - 1);
                const str = formatDate(d);
                startDateInput.value = str;
                endDateInput.value = str;
            } else if (type === 'beforeYesterday') {
                const d = new Date();
                d.setDate(d.getDate() - 2);
                const str = formatDate(d);
                startDateInput.value = str;
                endDateInput.value = str;
            } else if (type === 'last3') {
                const start = new Date();
                start.setDate(start.getDate() - 2);
                startDateInput.value = formatDate(start);
                endDateInput.value = formatDate(today);
            } else if (type === 'last7') {
                const start = new Date();
                start.setDate(start.getDate() - 6);
                startDateInput.value = formatDate(start);
                endDateInput.value = formatDate(today);
            } else if (type === 'all') {
                startDateInput.value = '';
                endDateInput.value = '';
            }

            if (btnElement) {
                btnElement.classList.add('active');
            }

            fetchData();
        }

        // 登录逻辑
        async function verifyPassword() {
            const password = passwordInput.value.trim();
            if (!password) {
                $(passwordInput).addClass('is-invalid');
                return;
            } else {
                $(passwordInput).removeClass('is-invalid');
            }

            try {
                const response = await fetch('login_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                });
                const data = await response.json();

                if (data.success) {
                    // 切换界面
                    passwordContainer.style.display = 'none';
                    // 移除 login-page 类以恢复正常背景
                    document.body.classList.remove('login-page');
                    document.body.style.height = 'auto'; // 重置高度
                    mainContent.style.display = 'block';
                    
                    initDates();
                    fetchData();
                } else {
                    alert(data.message || '密码错误');
                    passwordInput.value = '';
                }
            } catch (e) {
                console.error(e);
                alert('验证出错，请重试');
            }
        }

        // 获取数据
        async function fetchData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const trackNo = document.getElementById('trackNo').value.trim();

            loading.style.display = 'flex'; // Flex 用于居中
            tableBody.innerHTML = '';
            noData.style.display = 'none';

            const params = new URLSearchParams({
                // token: authToken, // 不再需要 token，使用 Session
                start_date: startDate,
                end_date: endDate,
                track_no: trackNo
            });

            try {
                const res = await fetch(`api_stats.php?${params}`);
                if (res.status === 401) {
                    alert('认证过期，请刷新重新登录');
                    location.reload();
                    return;
                }
                
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    console.error('JSON Parse Error:', e);
                    const cleanText = text.replace(/<[^>]*>?/gm, '');
                    alert('服务器错误:\n' + cleanText.substring(0, 200));
                    return;
                }
                
                if (data.error) {
                    alert('数据获取失败: ' + data.error);
                    return;
                }
                
                // 更新统计
                // 增加数字滚动动画效果 (可选，简单实现)
                document.getElementById('totalCount').textContent = data.stats.total_count;
                document.getElementById('totalFee').textContent = parseFloat(data.stats.total_fee).toFixed(2);

                // 更新表格
                if (data.list && data.list.length > 0) {
                    data.list.forEach(row => {
                        // 简单处理 carrier 样式
                        let carrierBadge = row.carrier || '-';
                        if(row.carrier === '顺丰') carrierBadge = '<span class="badge badge-primary">顺丰</span>';
                        else if(row.carrier === '韵达') carrierBadge = '<span class="badge badge-warning">韵达</span>';
                        else if(row.carrier === '信丰') carrierBadge = '<span class="badge badge-info">信丰</span>';

                        const tr = document.createElement('tr');
                        tr.className = 'clickable-row';
                        // 存储数据到 dataset 方便点击时读取
                        tr.dataset.track = row.track_no;
                        tr.dataset.fee = row.fee;
                        tr.dataset.carrier = row.carrier || '未知';
                        tr.dataset.time = row.created_at;
                        
                        tr.innerHTML = `
                            <td class="hidden-mobile">${row.created_at}</td>
                            <td>${row.track_no}</td>
                            <td>${carrierBadge}</td>
                            <td class="text-success font-weight-bold">¥${parseFloat(row.fee).toFixed(2)}</td>
                        `;
                        
                        // 绑定点击事件
                        tr.addEventListener('click', function() {
                            showDetail(this.dataset);
                        });
                        
                        tableBody.appendChild(tr);
                    });
                } else {
                    noData.style.display = 'block';
                }

            } catch (error) {
                console.error('Error:', error);
                alert('获取数据失败');
            } finally {
                loading.style.display = 'none';
            }
        }
        
        // 显示详情模态框
        function showDetail(data) {
            document.getElementById('modalTrackNo').textContent = data.track;
            document.getElementById('modalFee').textContent = parseFloat(data.fee).toFixed(2);
            document.getElementById('modalTime').textContent = data.time;
            
            // 处理物流商显示
            let carrierHtml = data.carrier;
            if(data.carrier === '顺丰') carrierHtml = '<span class="badge badge-primary">顺丰</span>';
            else if(data.carrier === '韵达') carrierHtml = '<span class="badge badge-warning">韵达</span>';
            else if(data.carrier === '信丰') carrierHtml = '<span class="badge badge-info">信丰</span>';
            document.getElementById('modalCarrier').innerHTML = carrierHtml;
            
            $('#detailModal').modal('show');
        }

        // 事件监听
        loginButton.addEventListener('click', verifyPassword);
        passwordInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') verifyPassword();
        });

        document.getElementById('startDate').addEventListener('change', () => {
            clearActiveQuickButtons();
            fetchData();
        });
        document.getElementById('endDate').addEventListener('change', () => {
            clearActiveQuickButtons();
            fetchData();
        });

        let debounceTimer;
        document.getElementById('trackNo').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchData, 300);
        });

        async function logout() {
            await fetch('login_api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'logout' })
            });
            location.reload();
        }

        async function submitChangePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('两次输入的新密码不一致');
                return;
            }

            try {
                const response = await fetch('change_password_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword
                    })
                });
                const data = await response.json();
                if (data.success) {
                    alert('密码修改成功');
                    $('#changePasswordModal').modal('hide');
                    document.getElementById('changePasswordForm').reset();
                } else {
                    alert(data.message || '修改失败');
                }
            } catch (e) {
                console.error(e);
                alert('请求失败');
            }
        }
    </script>
</body>
</html>
